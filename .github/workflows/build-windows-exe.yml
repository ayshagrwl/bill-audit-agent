name: Build Windows Rust Desktop Installer (.exe & .msi)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-windows-rust:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust Stable Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install Frontend Build Dependencies & Prepare Dist
        run: |
          npm install
          npm run prepare-dist

      - name: Build Windows Installers (.exe NSIS & .msi) via Tauri
        run: npx tauri build

      - name: Upload Windows .exe & .msi Installers Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BillAudit-Pro-Windows-Installer
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/billaudit-pro.exe
          if-no-files-found: error
